server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Revalidate every file on each load (cheap 304s when unchanged). Without
    # this, browsers cache files that only carry Last-Modified heuristically,
    # and after an update a fresh index.html runs against a stale style.css /
    # JS / language file — a broken, half-updated UI (#86).
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
